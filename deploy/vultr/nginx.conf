# nginx para Lucuma Proyectos en Vultr. Lo copia instalar.sh a /etc/nginx/sites-available/proyectos
# reemplazando __DOMINIO__ y __PUERTO__. Cloudflare va delante (proxy naranja) con SSL "Full (strict)".

server {
  listen 80;
  listen [::]:80;
  server_name __DOMINIO__ *.__DOMINIO__;
  return 301 https://$host$request_uri;
}

server {
  # http2 en el listen: la nginx de Ubuntu 24.04 (1.24) no conoce `http2 on;`.
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name __DOMINIO__ *.__DOMINIO__;

  # Certificado de origen de Cloudflare: comodín, dura 15 años (guía §3).
  ssl_certificate     /etc/ssl/proyectos/origen.pem;
  ssl_certificate_key /etc/ssl/proyectos/origen.key;

  # Un poco más que ARCHIVOS_MAX_MB (50): así el 413 con mensaje claro lo da la app, no nginx.
  client_max_body_size 64m;

  location / {
    proxy_pass http://127.0.0.1:__PUERTO__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # Las subidas pasan directo a la app (que cuenta bytes y corta en el máximo), sin
    # guardarse antes en el disco de nginx.
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
